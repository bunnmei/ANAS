<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#0E4A5C"/>
      <stop offset="1" stop-color="#041E2A"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BEA9C"/>
      <stop offset="1" stop-color="#2FC874"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- 背景:512x512 の正方形、角丸なし -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- アダプティブアイコンのセーフゾーン(108dp中66dp = 512px中 直径約313px)に収まるよう70%に縮小 -->
  <g transform="translate(256,256) scale(0.7) translate(-256,-277)">
    <!-- アンテナ -->
    <g stroke="#3DDC84" stroke-width="11" stroke-linecap="round">
      <line x1="194" y1="128" x2="168" y2="88"/>
      <line x1="318" y1="128" x2="344" y2="88"/>
    </g>
    <!-- 頭 -->
    <path d="M136,234 A120,120 0 0 1 376,234 Z" fill="url(#g)"/>
    <circle cx="204" cy="186" r="11" fill="#073042"/>
    <circle cx="308" cy="186" r="11" fill="#073042"/>

    <!-- 腕(丸い棒) -->
    <rect x="98" y="252" width="28" height="112" rx="14" fill="#3DDC84"/>
    <rect x="386" y="252" width="28" height="112" rx="14" fill="#3DDC84"/>

    <!-- 足(胴体の下から伸びる、先が丸い) -->
    <rect x="182" y="400" width="36" height="70" rx="18" fill="#2AA866"/>
    <rect x="294" y="400" width="36" height="70" rx="18" fill="#2AA866"/>

    <!-- ストレージ・スタック(胴体) -->
    <rect x="136" y="252" width="240" height="50" fill="#3DDC84"/>
    <rect x="136" y="314" width="240" height="50" fill="#33C477"/>
    <rect x="136" y="376" width="240" height="50" fill="#2AA866"/>

    <!-- スリットとLED -->
    <g fill="#073042">
      <rect x="160" y="274" width="96" height="6"/>
      <rect x="160" y="336" width="96" height="6"/>
      <rect x="160" y="398" width="96" height="6"/>
      <rect x="318" y="271" width="12" height="12"/>
      <rect x="318" y="333" width="12" height="12"/>
      <rect x="318" y="395" width="12" height="12"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="338" y="267" width="20" height="20" filter="url(#glow)" opacity="0.8"/>
      <rect x="342" y="271" width="12" height="12"/>
      <rect x="342" y="333" width="12" height="12" opacity="0.9"/>
      <rect x="342" y="395" width="12" height="12" opacity="0.9"/>
    </g>
  </g>
</svg>
